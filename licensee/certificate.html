<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Certificate · Boxing4Health Training</title>
<meta name="description" content="Your Boxing4Health Licensee Training completion certificate.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#19679e">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/fonts.css?v=22">
<link rel="stylesheet" href="assets/css/tokens.css?v=22">
<link rel="stylesheet" href="assets/css/site.css?v=22">
<link rel="stylesheet" href="assets/css/print.css?v=22" media="print">
<style>
  [data-cert-gate][data-unlocked="false"] .cert-unlocked{display:none}
  [data-cert-gate][data-unlocked="true"] .cert-locked{display:none}
  @media print{ .site-header,.site-footer,.cert-controls,.to-top{display:none!important} .certificate{margin:0} }
</style>
<script>(function(){try{var d=document.documentElement,s=localStorage;
d.setAttribute('data-theme',s.getItem('b4h-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
d.setAttribute('lang',s.getItem('b4h-lang')||'en');
if(s.getItem('b4h-contrast')==='high')d.setAttribute('data-contrast','high');
d.style.setProperty('--font-scale',s.getItem('b4h-font')||'1');
d.style.setProperty('--line-mult',s.getItem('b4h-line')||'1');}catch(e){}})();</script>
</head>
<body>
<div data-include="header"></div>
<main id="main">
  <section class="section"><div class="wrap wrap-narrow" data-cert-gate data-unlocked="false">

    <div class="cert-locked panel" style="text-align:center">
      <span class="chip" data-icon="lock" style="margin-inline:auto;width:64px;height:64px"></span>
      <h1 style="margin-top:1rem"><span data-i18n="cert.title">Certificate of Completion</span></h1>
      <p class="lead"><span data-i18n="cert.locked">Complete all modules and quizzes to unlock your certificate.</span></p>
      <a class="btn btn-primary" href="index.html#modules"><span data-icon="arrow-right"></span><span data-i18n="hub.progress">Your progress</span></a>
    </div>

    <div class="cert-unlocked">
      <div class="cert-controls panel panel-tinted" style="margin-bottom:1.5rem">
        <label style="font-weight:700;display:block;margin-bottom:.4rem" for="certname"><span data-i18n="cert.name">Enter your name</span></label>
        <input id="certname" data-cert-name type="text" style="width:100%;max-width:420px;padding:.7rem 1rem;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:1.1rem;background:var(--surface);color:var(--text)" placeholder="Your name">
        <div style="margin-top:1rem"><button class="btn btn-primary" data-cert-print><span data-icon="printer"></span><span data-i18n="cert.print">Print / Save as PDF</span></button></div>
      </div>

      <div class="certificate">
        <img src="assets/img/b4h-logo.png" alt="Boxing4Health" width="163" height="64" style="display:block;margin:0 auto .6rem;height:64px;width:auto">
        <h2 data-i18n="cert.title">Certificate of Completion</h2>
        <p class="muted" data-i18n="cert.sub">This certifies that</p>
        <div class="cert-name" data-cert-name-display>—</div>
        <p style="max-width:40ch;margin:1rem auto" data-i18n="cert.body">has completed the Boxing4Health Licensee Training Program</p>
        <p class="muted" style="margin-top:1.5rem"><span data-cert-date></span></p>
        <div class="cert-sign">
          <span class="cert-sign-name">Christine Seaby</span>
          <span class="cert-sign-title" data-i18n="cert.founder">Founder &amp; Owner, Boxing4Health</span>
        </div>
      </div>
    </div>

  </div></section>
</main>
<div data-include="footer"></div>
<script src="assets/js/icons.js?v=22"></script>
<script src="assets/js/i18n.js?v=22"></script>
<script src="assets/js/site.js?v=22"></script>
<script src="assets/js/progress.js?v=22"></script>
<script src="assets/js/search.js?v=22"></script>
<script src="assets/js/certificate.js?v=22"></script>
</body></html>
